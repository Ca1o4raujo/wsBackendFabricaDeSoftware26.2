{% extends 'catalogo/base.html' %}{% block content %}<h2>Categorias</h2><p><a href="{% url 'catalogo:categoria_criar' %}">Nova categoria</a></p><ul>{% for categoria in object_list %}<li>{{ categoria.nome }} — {{ categoria.descricao }} <a href="{% url 'catalogo:categoria_editar' categoria.pk %}">Editar</a> <a href="{% url 'catalogo:categoria_excluir' categoria.pk %}">Excluir</a></li>{% empty %}<li>Nenhuma categoria cadastrada.</li>{% endfor %}</ul>{% endblock %}
